name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Test
        run: make test

      - name: Build (smoke test)
        run: go build ./cmd/template-go-agent

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build cross-platform binaries
        run: make publish

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: template-go-agent-binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 90

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: template-go-agent-binaries
          path: dist

      - name: Compute version
        id: version
        run: echo "value=$(make -s print-version)" >> $GITHUB_OUTPUT

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          body: |
            Auto-built from `main`.

            **Commit:** [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Built:** ${{ github.event.head_commit.timestamp }}

            ${{ github.event.head_commit.message }}
          files: |
            dist/*.tar.gz
            dist/*.zip
          make_latest: true
          prerelease: false
