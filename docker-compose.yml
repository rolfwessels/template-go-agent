services:
  ollama:
    image: ollama/ollama:latest
    container_name: template-go-agent-ollama
    ports:
      - "11434:11434"
    volumes:
      - template-go-agent-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: pull nomic-embed-text
    restart: "no"

  dev:
    container_name: template-go-agent-dev
    build:
      context: ./
      dockerfile: Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ".:/template-go-agent"
      - "./zshrc:/home/dev/.zshrc"
      - template-go-agent-cache:/cache
      - /var/run/docker.sock:/var/run/docker.sock
      - template-go-agent-gocache:/home/dev/.cache/go-build
      - template-go-agent-gomod:/home/dev/go/pkg/mod
    environment:
      - GOPATH=/home/dev/go
      - GOCACHE=/home/dev/.cache/go-build
      - HISTFILE=/cache/.zsh_history
      - OLLAMA_BASE_URL=http://ollama:11434/api
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c", "mkdir -p /template-go-agent/.storage/logs && touch /template-go-agent/.storage/logs/app.log && exec tail -f /template-go-agent/.storage/logs/app.log"]

volumes:
  template-go-agent-cache:
  template-go-agent-gocache:
  template-go-agent-gomod:
  template-go-agent-ollama:
